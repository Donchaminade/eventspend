<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner ambient circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Card element -->
  <g filter="url(#shadow)">
    <rect x="96" y="128" width="320" height="256" rx="28" fill="url(#cardGrad)" />
    
    <!-- Header of card -->
    <rect x="96" y="128" width="320" height="64" rx="28" fill="#4338ca" />
    <rect x="96" y="160" width="320" height="32" fill="#4338ca" />

    <!-- Card chip & emblem -->
    <rect x="132" y="148" width="40" height="24" rx="6" fill="#fbbf24" />
    <circle cx="360" cy="160" r="14" fill="#a5b4fc" fill-opacity="0.8" />
    <circle cx="380" cy="160" r="14" fill="#f43f5e" fill-opacity="0.8" />

    <!-- Chart bars inside card -->
    <!-- Bar 1 -->
    <rect x="136" y="290" width="36" height="58" rx="8" fill="#6366f1" />
    <!-- Bar 2 -->
    <rect x="190" y="250" width="36" height="98" rx="8" fill="#06b6d4" />
    <!-- Bar 3 -->
    <rect x="244" y="220" width="36" height="128" rx="8" fill="#10b981" />
    <!-- Bar 4 (Budget line or balance) -->
    <rect x="298" y="268" width="36" height="80" rx="8" fill="#f59e0b" />
    <!-- Bar 5 -->
    <rect x="352" y="240" width="36" height="108" rx="8" fill="#ec4899" />

    <!-- Budget line indicator -->
    <path d="M 124 235 L 396 235" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" />
  </g>

  <!-- Sparkle floating tags -->
  <circle cx="396" cy="112" r="18" fill="#10b981" />
  <path d="M 390 112 L 394 116 L 402 108" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
